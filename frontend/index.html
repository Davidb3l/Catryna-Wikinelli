
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catryna Wikinelli — Developer Docs</title>
    <script>
      // Apply the stored theme BEFORE first paint.
      //
      // Two reasons, and the second is not optional:
      //  1. No flash. React's theme effect runs after mount, so the page
      //     otherwise paints Classic-light for a frame before Atelier lands.
      //  2. Correctness. When `.dark` is added to <html> after paint, the
      //     browser was observed NOT to re-style <body> for the descendant
      //     `dark:` selector — body matched `.dark\:bg-zinc-950:where(.dark,
      //     .dark *)` yet kept the `bg-white` background, while an identical
      //     div created afterwards resolved correctly. Setting the class before
      //     the body is styled removes the invalidation step entirely.
      //
      // Deliberately inline, blocking, and dependency-free; it must run before
      // the first style resolution. Kept in lockstep with the theme effect in
      // App.tsx and the PREFS_KEY there.
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('catryna.prefs.v1') || '{}');
          var style = p.themeStyle === 'atelier' ? 'atelier' : 'classic';
          // A MISSING `theme` MUST READ AS DARK, because that is App.tsx's
          // default (see the `defaults` object beside PREFS_KEY). This branch
          // previously treated it as `system`, so a first-time visitor on a
          // light-mode OS painted light here and then flipped to dark on mount
          // — the exact flash this script exists to prevent, on every new
          // install. Keep the two in lockstep; they disagreed for months.
          var dark =
            style === 'atelier' ||
            p.theme === 'dark' ||
            !p.theme ||
            (p.theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var r = document.documentElement;
          r.classList.toggle('dark', dark);
          r.setAttribute('data-theme', style);
        } catch (e) {
          /* No storage (private mode) — fall through to the app's defaults. */
        }
      })();
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.5);
        }
        /* Full-screen editor canvases need an explicitly sized, positioned
           parent — Excalidraw and reactflow both fill their container. */
        .catryna-canvas-fill {
            position: relative !important;
            height: 100% !important;
            width: 100% !important;
        }
    </style>
</head>
<body class="bg-white dark:bg-zinc-950 text-navy dark:text-zinc-100 transition-colors duration-200">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
