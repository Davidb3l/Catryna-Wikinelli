name: CI

# Runs the repo's own gate (the same checks as `bun run check`, plus the
# backend typecheck that `bun run typecheck` doesn't cover) on every push and
# PR, on all three host OSes. Modeled on Sirius Forester's workflow.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `catryna drift` diffs each doc's anchors from its verifiedCommit to
          # HEAD, so it needs the full history, not a shallow clone.
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install viewer dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Typecheck (backend)
        run: bunx tsc --noEmit -p .

      - name: Typecheck (viewer)
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Lint docs
        run: bun run lint

      - name: Drift
        # Exits 3 when a doc's anchored code changed since it was verified.
        run: bun run drift
